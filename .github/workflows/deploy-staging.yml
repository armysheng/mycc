name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_PROJECT_DIR: ${{ secrets.STAGING_PROJECT_DIR }}
      STAGING_FRONTEND_DIST_DIR: ${{ secrets.STAGING_FRONTEND_DIST_DIR }}
      STAGING_BACKEND_HEALTH_URL: ${{ secrets.STAGING_BACKEND_HEALTH_URL }}
      STAGING_BACKEND_READY_URL: ${{ secrets.STAGING_BACKEND_READY_URL }}
      STAGING_BACKEND_READY_TOKEN: ${{ secrets.STAGING_BACKEND_READY_TOKEN }}
      STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
      STAGING_BACKEND_RESTART_CMD: ${{ secrets.STAGING_BACKEND_RESTART_CMD }}
      STAGING_NODE_BIN_DIR: ${{ secrets.STAGING_NODE_BIN_DIR }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check deployment impact
        id: deployment_impact
        run: |
          set -euo pipefail
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No parent commit available; deploy to be safe."
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            echo "deploy_frontend=true" >> "${GITHUB_OUTPUT}"
            echo "deploy_backend=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --name-only HEAD^ HEAD | tee /tmp/staging-changed-files.txt

          should_deploy=false
          deploy_frontend=false
          deploy_backend=false
          while IFS= read -r file; do
            if [ -z "${file}" ]; then
              continue
            fi

            case "${file}" in
              docs/*|mycc-backend/docs/*|*.md|TODO.md|MYCC_STARTUP_GUIDE.md|.github/workflows/*|mycc-backend/src/scripts/staging-workflow.test.ts|mycc-backend/scripts/landing-pr-classify.ts|mycc-backend/scripts/verify-e2b-release-readiness.ts|mycc-backend/scripts/harness-verify.ts|mycc-backend/scripts/agent-eval-static.ts|mycc-backend/scripts/smoke-auth-onboarding.ts|mycc-backend/scripts/smoke-auth-privacy.ts|mycc-backend/scripts/smoke-e2b-*.ts)
                echo "non-deploying: ${file}"
                ;;
              mycc-web-react/*)
                should_deploy=true
                deploy_frontend=true
                echo "frontend-impacting: ${file}"
                ;;
              mycc-backend/*|mycc-sandbox/*|evals/*|scripts/*)
                should_deploy=true
                deploy_backend=true
                echo "backend-impacting: ${file}"
                ;;
              *)
                should_deploy=true
                deploy_frontend=true
                deploy_backend=true
                echo "deployment-impacting: ${file}"
                ;;
            esac
          done < /tmp/staging-changed-files.txt

          echo "should_deploy=${should_deploy}" >> "${GITHUB_OUTPUT}"
          echo "deploy_frontend=${deploy_frontend}" >> "${GITHUB_OUTPUT}"
          echo "deploy_backend=${deploy_backend}" >> "${GITHUB_OUTPUT}"

      - name: Skip remote deploy
        if: steps.deployment_impact.outputs.should_deploy != 'true'
        run: echo "No deployment-impacting files changed; skipping staging SSH, migration, build, restart, and health probes."

      - name: Validate required staging secrets
        if: steps.deployment_impact.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          for key in STAGING_HOST STAGING_USER STAGING_SSH_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done
          if [ -z "${STAGING_PORT:-}" ]; then
            echo "STAGING_PORT not set, fallback to 22"
          fi
          if [ -z "${STAGING_PROJECT_DIR:-}" ]; then
            echo "STAGING_PROJECT_DIR not set, fallback to /home/armysheng/mycc"
          fi

      - name: Setup SSH agent
        if: steps.deployment_impact.outputs.should_deploy == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add staging host to known_hosts
        if: steps.deployment_impact.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${STAGING_PORT:-22}" -H "${STAGING_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy on staging server
        if: steps.deployment_impact.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          SSH_PORT="${STAGING_PORT:-22}"
          SSH_OPTS=(-p "${SSH_PORT}" -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa)
          PROJECT_DIR="${STAGING_PROJECT_DIR:-/home/armysheng/mycc}"
          FRONTEND_DIST_DIR="${STAGING_FRONTEND_DIST_DIR:-}"
          NODE_BIN_DIR="${STAGING_NODE_BIN_DIR:-}"
          DEPLOY_FRONTEND="${{ steps.deployment_impact.outputs.deploy_frontend }}"
          DEPLOY_BACKEND="${{ steps.deployment_impact.outputs.deploy_backend }}"
          BACKEND_RESTART_CMD_B64="$(printf '%s' "${STAGING_BACKEND_RESTART_CMD:-}" | base64 -w 0)"
          ssh "${SSH_OPTS[@]}" "${STAGING_USER}@${STAGING_HOST}" \
            "PROJECT_DIR='${PROJECT_DIR}' FRONTEND_DIST_DIR='${FRONTEND_DIST_DIR}' STAGING_NODE_BIN_DIR='${NODE_BIN_DIR}' DEPLOY_FRONTEND='${DEPLOY_FRONTEND}' DEPLOY_BACKEND='${DEPLOY_BACKEND}' STAGING_BACKEND_RESTART_CMD_B64='${BACKEND_RESTART_CMD_B64}' bash -s" <<'EOF'
          set -euo pipefail
          STAGING_BACKEND_RESTART_CMD=""
          if [ -n "${STAGING_BACKEND_RESTART_CMD_B64:-}" ]; then
            STAGING_BACKEND_RESTART_CMD="$(printf '%s' "${STAGING_BACKEND_RESTART_CMD_B64}" | base64 -d)"
          fi
          if [ -n "${STAGING_NODE_BIN_DIR:-}" ]; then
            if [ ! -x "${STAGING_NODE_BIN_DIR}/node" ] || [ ! -x "${STAGING_NODE_BIN_DIR}/npm" ]; then
              echo "STAGING_NODE_BIN_DIR must contain executable node and npm: ${STAGING_NODE_BIN_DIR}" >&2
              exit 1
            fi
            export PATH="${STAGING_NODE_BIN_DIR}:${PATH}"
            node --version
            npm --version
          fi

          cd "${PROJECT_DIR}"

          # 清理历史部署产生的临时 env 备份，避免误判为脏工作树
          find mycc-backend -maxdepth 1 -type f -name '.env.bak-*' -delete 2>/dev/null || true

          DIRTY_STATUS="$(git status --porcelain --untracked-files=all | grep -vE '^\?\? mycc-backend/\.env\.bak-' || true)"
          if [ -n "${DIRTY_STATUS}" ]; then
            TS="$(date +%Y%m%d-%H%M%S)"
            BACKUP_DIR="${HOME}/deploy-backups"
            mkdir -p "${BACKUP_DIR}"
            printf '%s\n' "${DIRTY_STATUS}" | tee "${BACKUP_DIR}/dirty-${TS}.status"
            git diff > "${BACKUP_DIR}/dirty-${TS}.patch" || true
            echo "ERROR: remote working tree is dirty, deploy aborted."
            echo "Backup: ${BACKUP_DIR}/dirty-${TS}.patch"
            exit 2
          fi

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          if [ "${DEPLOY_FRONTEND}" = "true" ]; then
            npm -C mycc-web-react ci
            npm -C mycc-web-react run build

            if [ -n "${FRONTEND_DIST_DIR}" ]; then
              mkdir -p "${FRONTEND_DIST_DIR}"
              rsync -a --delete mycc-web-react/dist/ "${FRONTEND_DIST_DIR}/"
            fi
          fi

          if [ "${DEPLOY_BACKEND}" = "true" ]; then
            npm -C mycc-backend ci
            npm -C mycc-backend run db:migrate
            npm -C mycc-backend run build

            if [ -n "${STAGING_BACKEND_RESTART_CMD:-}" ]; then
              echo "restart via custom command"
              bash -lc "${STAGING_BACKEND_RESTART_CMD}"
            else
              USER_UNIT="$(systemctl --user list-unit-files --type=service 2>/dev/null | awk '/mycc/ {print $1; exit}')"
              SYS_UNIT="$(sudo systemctl list-unit-files --type=service 2>/dev/null | awk '/mycc/ {print $1; exit}')"
              if [ -n "${USER_UNIT}" ] && systemctl --user restart "${USER_UNIT}" 2>/dev/null; then
                echo "restarted with systemctl --user ${USER_UNIT}"
              elif [ -n "${SYS_UNIT}" ] && sudo systemctl restart "${SYS_UNIT}" 2>/dev/null; then
                echo "restarted with sudo systemctl ${SYS_UNIT}"
              elif command -v pm2 >/dev/null 2>&1 && pm2 restart mycc-backend 2>/dev/null; then
                echo "restarted with pm2 mycc-backend"
              else
                echo "failed to restart backend service" >&2
                systemctl --user list-unit-files --type=service 2>/dev/null | grep -i mycc || true
                sudo systemctl list-unit-files --type=service 2>/dev/null | grep -i mycc || true
                pm2 list || true
                exit 1
              fi
            fi
          fi
          EOF

      - name: Verify backend health endpoint (via SSH)
        if: steps.deployment_impact.outputs.deploy_backend == 'true'
        run: |
          set -euo pipefail
          SSH_PORT="${STAGING_PORT:-22}"
          SSH_OPTS=(-p "${SSH_PORT}" -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa)
          HEALTH_URL="${STAGING_BACKEND_HEALTH_URL:-http://127.0.0.1:8080/health}"
          MAX_RETRIES="${STAGING_BACKEND_HEALTH_RETRIES:-20}"
          RETRY_INTERVAL="${STAGING_BACKEND_HEALTH_RETRY_INTERVAL:-3}"

          passed=false
          for attempt in $(seq 1 "${MAX_RETRIES}"); do
            if ssh "${SSH_OPTS[@]}" "${STAGING_USER}@${STAGING_HOST}" \
              "curl -fsS --connect-timeout 2 --max-time 5 '${HEALTH_URL}'" >/dev/null; then
              echo "Backend health check passed (${attempt}/${MAX_RETRIES})"
              passed=true
              break
            fi
            echo "Backend not ready (${attempt}/${MAX_RETRIES}), retry in ${RETRY_INTERVAL}s..."
            sleep "${RETRY_INTERVAL}"
          done

          if [ "${passed}" != "true" ]; then
            echo "Backend health check failed after ${MAX_RETRIES} attempts: ${HEALTH_URL}" >&2
            ssh "${SSH_OPTS[@]}" "${STAGING_USER}@${STAGING_HOST}" '
              set +e
              echo "--- systemctl --user status (mycc*) ---" >&2
              systemctl --user --no-pager --full status "mycc*" 2>/dev/null || true
              echo "--- pm2 list ---" >&2
              pm2 list 2>/dev/null || true
              echo "--- recent user logs ---" >&2
              journalctl --user -n 80 --no-pager 2>/dev/null || true
            ' || true
            exit 1
          fi

      - name: Verify backend deep readiness endpoint (via SSH)
        if: steps.deployment_impact.outputs.deploy_backend == 'true'
        run: |
          set -euo pipefail
          SSH_PORT="${STAGING_PORT:-22}"
          SSH_OPTS=(-p "${SSH_PORT}" -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa)
          READY_URL="${STAGING_BACKEND_READY_URL:-http://127.0.0.1:8080/readyz/deep}"
          READY_AUTH_HEADER_B64=""
          if [ -n "${STAGING_BACKEND_READY_TOKEN:-}" ]; then
            READY_AUTH_HEADER_B64="$(printf 'Authorization: Bearer %s' "${STAGING_BACKEND_READY_TOKEN}" | base64 -w 0)"
          fi
          MAX_RETRIES="${STAGING_BACKEND_READY_RETRIES:-20}"
          RETRY_INTERVAL="${STAGING_BACKEND_READY_RETRY_INTERVAL:-3}"

          passed=false
          for attempt in $(seq 1 "${MAX_RETRIES}"); do
            READY_BODY="$(ssh "${SSH_OPTS[@]}" "${STAGING_USER}@${STAGING_HOST}" \
              "READY_URL='${READY_URL}' READY_AUTH_HEADER_B64='${READY_AUTH_HEADER_B64}' bash -s" <<'EOF' 2>/dev/null || true
          set -euo pipefail
          READY_CURL_ARGS=()
          if [ -n "${READY_AUTH_HEADER_B64:-}" ]; then
            READY_CURL_ARGS=(-H "$(printf '%s' "${READY_AUTH_HEADER_B64}" | base64 -d)")
          fi
          curl -fsS --connect-timeout 2 --max-time 5 "${READY_CURL_ARGS[@]}" "${READY_URL}"
          EOF
            )"
            if [ -n "${READY_BODY}" ]; then
              if printf '%s' "${READY_BODY}" | grep -Eq '"runtime"[[:space:]]*:[[:space:]]*\{[^}]*"status"[[:space:]]*:[[:space:]]*"pass"'; then
                echo "Backend deep readiness check passed (${attempt}/${MAX_RETRIES})"
                passed=true
                break
              fi
              echo "Backend responded but runtime readiness is not pass (${attempt}/${MAX_RETRIES})"
            fi
            echo "Backend not ready (${attempt}/${MAX_RETRIES}), retry in ${RETRY_INTERVAL}s..."
            sleep "${RETRY_INTERVAL}"
          done

          if [ "${passed}" != "true" ]; then
            echo "Backend deep readiness check failed after ${MAX_RETRIES} attempts: ${READY_URL}" >&2
            ssh "${SSH_OPTS[@]}" "${STAGING_USER}@${STAGING_HOST}" \
              "READY_AUTH_HEADER_B64='${READY_AUTH_HEADER_B64}' bash -s" <<'EOF'
              set +e
              READY_CURL_ARGS=()
              if [ -n "${READY_AUTH_HEADER_B64:-}" ]; then
                READY_CURL_ARGS=(-H "$(printf '%s' "${READY_AUTH_HEADER_B64}" | base64 -d)")
              fi
              echo "--- /health ---" >&2
              curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/health 2>&1 || true
              echo "--- /readyz ---" >&2
              curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/readyz 2>&1 || true
              echo "--- /readyz/deep ---" >&2
              curl -fsS --connect-timeout 2 --max-time 5 "${READY_CURL_ARGS[@]}" http://127.0.0.1:8080/readyz/deep 2>&1 || true
              echo "--- recent user logs ---" >&2
              journalctl --user -n 80 --no-pager 2>/dev/null || true
          EOF
            exit 1
          fi

      - name: Verify frontend endpoint (optional)
        if: steps.deployment_impact.outputs.deploy_frontend == 'true' && env.STAGING_FRONTEND_URL != ''
        run: |
          set -euo pipefail
          curl -fsSIL "${STAGING_FRONTEND_URL}" | head -n 20
